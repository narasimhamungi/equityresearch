name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Pulls Trellis at the pinned tag. The suite is offline; scripts/ that hit
      # SEC EDGAR are not run here.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q
